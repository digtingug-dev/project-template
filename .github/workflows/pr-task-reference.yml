name: PR Task Reference

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

jobs:
  validate-task-reference:
    name: Validate ADO Task Reference
    runs-on: ubuntu-latest

    steps:
      - name: Check for ADO task reference
        if: github.actor != 'dependabot[bot]'
        uses: JJ/github-pr-contains-action@releases/v14
        with:
          bodyContains: "AB#"
