name: PR Title Validation

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

jobs:
  validate:
    name: Validate PR Title
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR title
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;

            const pattern = /^(fix|feat|refactor|chore|ci)(\([^)]+\))?: .+/;

            if (!pattern.test(title)) {
              core.setFailed(
                'Invalid PR title. Use: type(scope): description'
              );
            }
