name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up project
        run: |
          if [ ! -f "./scripts/setup.sh" ]; then
            echo "::error::scripts/setup.sh is required by the CI contract."
            exit 1
          fi

          chmod +x ./scripts/setup.sh
          ./scripts/setup.sh

      - name: Check formatting
        run: |
          if [ ! -f "./scripts/format.sh" ]; then
            echo "::error::scripts/format.sh is required by the CI contract."
            exit 1
          fi

          chmod +x ./scripts/format.sh
          ./scripts/format.sh

      - name: Run linting
        run: |
          if [ ! -f "./scripts/lint.sh" ]; then
            echo "::error::scripts/lint.sh is required by the CI contract."
            exit 1
          fi

          chmod +x ./scripts/lint.sh
          ./scripts/lint.sh

      - name: Run tests
        run: |
          if [ ! -f "./scripts/test.sh" ]; then
            echo "::error::scripts/test.sh is required by the CI contract."
            exit 1
          fi

          chmod +x ./scripts/test.sh
          ./scripts/test.sh

      - name: Check coverage
        run: |
          if [ ! -f "./scripts/coverage.sh" ]; then
            echo "::error::scripts/coverage.sh is required by the CI contract."
            exit 1
          fi

          chmod +x ./scripts/coverage.sh
          ./scripts/coverage.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up project
        run: |
          if [ ! -f "./scripts/setup.sh" ]; then
            echo "::error::scripts/setup.sh is required by the CI contract."
            exit 1
          fi

          chmod +x ./scripts/setup.sh
          ./scripts/setup.sh

      - name: Build Docker image
        env:
          IMAGE_NAME: react-frontend-master-template
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if [ ! -f "./scripts/build.sh" ]; then
            echo "::error::scripts/build.sh is required by the CI contract."
            exit 1
          fi

          chmod +x ./scripts/build.sh
          ./scripts/build.sh

      - name: Verify Docker image
        env:
          IMAGE_NAME: react-frontend-master-template
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker image inspect "${IMAGE_NAME}:${IMAGE_TAG}" > /dev/null

      - name: Export Docker image
        env:
          IMAGE_NAME: react-frontend-master-template
          IMAGE_TAG: ${{ github.sha }}
        run: |
          mkdir -p artifacts

          docker save \
            "${IMAGE_NAME}:${IMAGE_TAG}" \
            --output "artifacts/${IMAGE_NAME}-${IMAGE_TAG}.tar"

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
